<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무분장 인수인계</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1c1b19; --dim:#6b675f; --line:#e2ded6;
  --keep:#4b6bdc; --out:#c2410c; --in:#0f766e; --common:#7a7566; --tbd:#9333ea;
  --accent:#1c1b19; --chip:#efece6; --warn:#b91c1c; --zebra:#faf9f6;
  --nav:#26241f; --nav-ink:#e9e5dc; --nav-dim:#9a9488; --nav-line:#3a362f; --nav-hover:#332f28;
  --amber2:#8a6410;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513; --card:#1f1e1b; --ink:#ece9e3; --dim:#9d978c; --line:#33312c;
  --keep:#8ba3f5; --out:#f19a6b; --in:#5cc5b6; --common:#a39c8c; --tbd:#c99af5;
  --accent:#ece9e3; --chip:#2a2825; --warn:#f08a86; --zebra:#232220;
  --nav:#101214; --nav-ink:#dedbd5; --nav-dim:#8b8e8b; --nav-line:#2a2e32; --nav-hover:#1e2226; --amber2:#d6ad5c;
}}
:root[data-theme="dark"]{
  --bg:#161513; --card:#1f1e1b; --ink:#ece9e3; --dim:#9d978c; --line:#33312c;
  --keep:#8ba3f5; --out:#f19a6b; --in:#5cc5b6; --common:#a39c8c; --tbd:#c99af5;
  --accent:#ece9e3; --chip:#2a2825; --warn:#f08a86; --zebra:#232220;
  --nav:#101214; --nav-ink:#dedbd5; --nav-dim:#8b8e8b; --nav-line:#2a2e32; --nav-hover:#1e2226; --amber2:#d6ad5c;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif;margin:0}

/* 좌측 카테고리 사이드바 */
.shell{display:grid;grid-template-columns:214px minmax(0,1fr);align-items:start}
nav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
    background:var(--nav);color:var(--nav-ink);padding:18px 10px 26px;
    display:flex;flex-direction:column;gap:15px}
.brand{color:var(--nav-ink);font-size:14px;font-weight:700;letter-spacing:-.01em;padding:0 6px 12px 12px;
       border-bottom:1px solid var(--nav-line);line-height:1.35;
       display:flex;align-items:flex-start;gap:6px}
.brand>span{flex:1;min-width:0}
#navFold{flex:none;background:none;border:none;color:var(--nav-dim);cursor:pointer;
         font-size:15px;line-height:1;padding:2px 7px;border-radius:6px}
#navFold:hover{background:var(--nav-hover);color:var(--nav-ink)}
#navUnfold{display:none;position:fixed;top:14px;left:14px;z-index:30;
           background:var(--nav);color:var(--nav-ink);border:none;border-radius:9px;
           padding:8px 12px;font:inherit;font-size:15px;line-height:1;cursor:pointer;
           box-shadow:0 2px 10px rgba(0,0,0,.18)}
#navUnfold:hover{background:var(--nav-hover)}
body.folded .shell{grid-template-columns:minmax(0,1fr)}
body.folded nav{display:none}
body.folded #navUnfold{display:block}
body.folded .content{padding-left:62px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--nav-dim);margin-top:3px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp>b{font-size:10.5px;letter-spacing:.09em;color:var(--nav-dim);font-weight:700;padding:0 12px 5px}
nav button{background:none;border:none;color:var(--nav-ink);text-align:left;
           padding:7px 12px;font:inherit;font-size:13px;line-height:1.35;cursor:pointer;
           border-radius:8px;border-left:3px solid transparent;transition:.14s}
nav button:hover{background:var(--nav-hover);border-color:transparent}
nav button.on{background:var(--card);color:var(--ink);font-weight:600;border-left-color:var(--keep)}
.navrow{display:flex;align-items:stretch;gap:0}
.navrow>button:first-child{flex:1;min-width:0}
.star{flex:none;background:none;border:none;color:transparent;cursor:pointer;
      padding:0 7px;font-size:13px;line-height:1;border-radius:6px}
.navrow:hover .star{color:var(--nav-dim)}
.star:hover{background:var(--nav-hover);color:var(--nav-ink)!important}
.star.on{color:#e8b84b!important}
#favList{display:flex;flex-direction:column;gap:2px}
#favGrp{padding-bottom:13px;border-bottom:1px solid var(--nav-line)}
.content{padding-block:26px;padding-left:24px;padding-right:24px;max-width:1240px;min-width:0}
#navToggle{display:none}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  #navToggle{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:10px 14px;
             background:var(--nav);color:var(--nav-ink);border:none;border-radius:10px;
             font:inherit;font-size:14px;text-align:left;cursor:pointer}
  nav{position:static;height:auto;margin:8px 16px 0;border-radius:12px;display:none}
  body.folded #navUnfold{display:none}
  body.folded .content{padding-left:16px}
  #navFold{display:none}
  nav.open{display:flex}
  .brand{display:none}
  .content{padding-left:16px;padding-right:16px;padding-block:16px}
}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--dim)}
.bar button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.v{font-weight:600}
.spacer{flex:1}
#q{flex:none;width:170px;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.empty{color:var(--dim);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:10px;grid-column:1/-1}
.none{font-size:12.5px;color:var(--dim);font-style:italic}
.chip{background:var(--chip);color:var(--dim);font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;display:inline-block}
.chip.keep{background:var(--keep);color:#fff;font-weight:600}
.chip.out{background:var(--out);color:#fff;font-weight:600}
.chip.in{background:var(--in);color:#fff;font-weight:600}
.chip.common{background:var(--common);color:#fff;font-weight:600}
.chip.tbd{background:var(--tbd);color:#fff;font-weight:600}
.chip.other{background:var(--dim);color:#fff;font-weight:600}
.card[data-t="other"]{border-left-color:var(--dim)}
.grp[data-t="other"]>h3{background:var(--dim)}
.chip.sys{border:1px solid var(--line);background:transparent}

/* ── 카드 보기 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:14px 16px}
.card[data-t="keep"]{border-left-color:var(--keep)}
.card[data-t="out"]{border-left-color:var(--out)}
.card[data-t="in"]{border-left-color:var(--in)}
.card[data-t="common"]{border-left-color:var(--common)}
.card[data-t="tbd"]{border-left-color:var(--tbd)}
.card h2{font-size:15.5px;margin:0 0 7px;letter-spacing:-.01em;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.desc{font-size:13.5px;margin-bottom:8px}
.dl{font-size:12.5px;color:var(--warn);font-weight:600;margin-bottom:8px}
.sec{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.sec>b{display:block;font-size:11px;color:var(--dim);letter-spacing:.05em;margin-bottom:5px;font-weight:600}
.step{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;padding:2px 0;cursor:pointer}
.step input{margin-top:5px;flex:none}
.step.d span{color:var(--dim);text-decoration:line-through}
ul{margin:0;padding-left:16px;font-size:13px;color:var(--dim);word-break:break-word}
ul.trap li{color:var(--warn)}
.logrow{display:flex;gap:8px;font-size:13px;padding:3px 0;align-items:flex-start}
.logrow time{color:var(--dim);font-size:11.5px;flex:none;width:66px;padding-top:2px}
.logrow p{margin:0;flex:1;white-space:pre-wrap}
.logrow button{border:none;background:none;color:var(--dim);padding:0 4px;font-size:14px}
.addlog{display:flex;gap:6px;margin-top:7px}
.addlog input{flex:1;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.addlog button{font-size:12px;padding:4px 10px}
.act{margin-top:12px;display:flex;gap:6px}
.act button{font-size:12px;padding:4px 9px}

/* ── 표 보기 ── */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--dim);letter-spacing:.04em;cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
th:hover{color:var(--ink)}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--chip)}
td.nm{font-weight:600;cursor:pointer}
td.nm:hover{text-decoration:underline}
td.warn{color:var(--warn)}
td.num{text-align:right;color:var(--dim);white-space:nowrap}

/* ── 인수인계서 보기 ── */
.doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 30px;max-width:900px;margin:0 auto}
.doc h2{text-align:center;font-size:20px;letter-spacing:.2em;margin:0 0 6px}
.doc .docmeta{text-align:center;color:var(--dim);font-size:12.5px;margin-bottom:22px}
.sign{display:flex;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:24px;font-size:13px}
.sign div{flex:1;min-width:150px}
.sign b{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;font-weight:600}
.sign span{display:block;border-bottom:1px solid var(--line);min-height:26px}
.grp{margin-bottom:26px}
.grp>h3{font-size:14px;margin:0 0 10px;padding:6px 10px;border-radius:6px;color:#fff}
.grp[data-t="out"]>h3{background:var(--out)}
.grp[data-t="in"]>h3{background:var(--in)}
.grp[data-t="keep"]>h3{background:var(--keep)}
.grp[data-t="tbd"]>h3{background:var(--tbd)}
.grp[data-t="common"]>h3{background:var(--common)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;break-inside:avoid}
.item h4{margin:0 0 6px;font-size:14.5px}
.item dl{display:grid;grid-template-columns:74px 1fr;gap:3px 10px;margin:0;font-size:13px}
.item dt{color:var(--dim);font-size:11.5px;padding-top:3px}
.item dd{margin:0}
.item ol{margin:2px 0 0;padding-left:18px;font-size:13px}
.item .blank{border-bottom:1px dotted var(--line);min-height:22px;display:block}

/* ── 마감 달력 보기 ── */
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mon{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mon h3{margin:0 0 8px;font-size:13px;color:var(--dim);letter-spacing:.05em}
.mon.hit h3{color:var(--warn)}
.dl-item{font-size:13px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.dl-item:first-of-type{border-top:none}
.dl-item b{color:var(--warn);margin-right:6px;font-variant-numeric:tabular-nums}
.dl-item span{color:var(--dim);font-size:11.5px;display:block}
.calnote{font-size:12px;color:var(--dim);margin:14px 0 10px}

/* ── 사람별 / 부서별 / 조직도 ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px;align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.pcard.me{border-color:var(--keep);border-width:2px}
.pcard h3{margin:0 0 3px;font-size:15px}
.pcard h3 em{font-style:normal;font-size:11px;color:var(--keep);font-weight:700;margin-left:5px}
.pcard .rank{font-size:12px;color:var(--dim);margin-bottom:7px}
.pcard .role{font-size:13px;margin-bottom:8px}
.pcard ol{margin:0;padding-left:18px;font-size:12.5px;color:var(--dim)}
.pcard ol li{padding:1px 0}
.vacant{opacity:.72;border-style:dashed}
.link{display:block;font-size:12.5px;padding:3px 0;cursor:pointer;border-top:1px solid var(--line)}
.link:hover{text-decoration:underline}
.dept{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden}
.dept>h3{margin:0;padding:9px 14px;background:var(--chip);font-size:14px;display:flex;gap:10px;align-items:baseline}
.dept>h3 small{font-weight:400;color:var(--dim);font-size:12px}
.dept table{min-width:0}
.org{overflow-x:auto;padding-bottom:8px}
.tier{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.node{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;text-align:center;font-size:13px;min-width:140px}
.node b{display:block;font-size:14px}
.node small{color:var(--dim);font-size:11px}
/* ── 캘린더 ── */
.calhead{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.calhead h3{margin:0;font-size:18px;min-width:120px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:700px}
.calscroll{overflow-x:auto}
.cal .dow{background:var(--chip);text-align:center;font-size:11px;color:var(--dim);padding:6px 0;font-weight:600}
.cal .dow.sun{color:var(--warn)}
.cell{background:var(--card);min-height:92px;padding:5px 6px}
.cell.pad{background:var(--zebra);opacity:.5}
.cell.today{outline:2px solid var(--keep);outline-offset:-2px}
.cell>.dnum{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-bottom:3px}
.cell.sun>.dnum{color:var(--warn)}
.ev{font-size:11px;line-height:1.35;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;
    background:var(--chip);color:var(--ink);border-left:3px solid var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{filter:brightness(.95)}
.ev[data-k="task"]{border-left-color:var(--keep)}
.ev[data-k="out"]{border-left-color:var(--out)}
.ev[data-k="in"]{border-left-color:var(--in)}
.ev[data-k="신고·보고"]{border-left-color:#b45309}
.ev[data-k="보험·구독 만기"]{border-left-color:#7c3aed}
.ev[data-k="지도점검"],.ev[data-k="평가"],.ev[data-k="점검"]{border-left-color:var(--warn);background:var(--warn);color:#fff}
.ev[data-k="회의"],.ev[data-k="내부점검"]{border-left-color:var(--common)}
.ev[data-k="행사"]{border-left-color:#db2777}
.ev[data-k="면접"],.ev[data-k="채용"]{border-left-color:#0891b2}
.ev[data-k="교육"],.ev[data-k="의무교육"]{border-left-color:#65a30d}
.ev[data-k="임기"]{border-left-color:#9333ea}
.strip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}
.strip b{font-size:11px;color:var(--dim);letter-spacing:.05em;display:block;margin-bottom:6px}
.strip .ev{display:inline-block;margin-right:5px;white-space:normal;max-width:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ── 인수인계서 출력 ── */
.docbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--card);
        border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:14px}
.docbar>b{font-size:11.5px;color:var(--dim);letter-spacing:.04em;margin-right:2px}
.docbar .spacer{flex:1}
.docbar button.go{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.docsum{font-size:12.5px;color:var(--dim);width:100%;padding-top:2px}
.item.unpicked{display:none}
.pickbox{float:right;margin:-2px 0 0 8px;cursor:pointer}
.grp>h3 .gsel{float:right;font-size:11px;font-weight:400;background:rgba(255,255,255,.22);
              border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;
              padding:1px 8px;cursor:pointer;margin-left:6px}
body.docedit .ed{outline:1px dashed var(--keep);outline-offset:3px;border-radius:3px;
                 min-height:18px;padding:1px 2px;display:block}
body.docedit .ed:focus{outline:2px solid var(--keep);background:var(--bg)}

/* ── 공유 동기화 ── */
.syncstate{font-size:11.5px;color:var(--nav-dim);padding:2px 12px 6px;line-height:1.45}
.syncstate b{display:block;color:var(--nav-ink);font-size:12.5px;font-weight:600}
.syncstate.on b{color:#7fd3c4}
.syncstate.err b{color:#f0a08a}
#logdlg .row>div{min-width:150px}
.conflict{border:1px solid var(--warn);border-left-width:4px;border-radius:9px;
          background:var(--card);padding:13px 15px;margin-bottom:12px}
.conflict b{display:block;color:var(--warn);margin-bottom:4px}

/* ── 백업 ── */
.bkrow{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.bkrow:first-of-type{border-top:none}
.bkrow time{flex:none;width:132px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.bkrow .cnt2{flex:1;color:var(--dim);font-size:12px}
.bkrow .cnt2 b{color:var(--ink);font-variant-numeric:tabular-nums}
.bkrow button{font-size:12px;padding:3px 10px}

/* ── 위원회 · 교육 ── */
.cmt{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden}
.cmt>h3{margin:0;padding:11px 15px;background:var(--chip);font-size:14.5px;
        display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.cmt>h3 small{font-weight:400;color:var(--dim);font-size:11.5px}
.cmt .rule{padding:9px 15px 0;font-size:12.5px;color:var(--dim)}
.cmt .rule b{color:var(--ink);font-weight:600}
.cmt table{min-width:0}
.term{font-variant-numeric:tabular-nums;white-space:nowrap}
.term.over{color:var(--warn);font-weight:700}
.term.soon{color:var(--amber2);font-weight:600}
.vacant2{color:var(--dim);font-style:italic}
.edu{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px}
.edu h4{margin:0 0 4px;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.edu h4 .basis{font-size:11px;color:var(--dim);font-weight:400}
.edu .line{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.edu .prog{height:7px;border-radius:4px;background:var(--chip);overflow:hidden;margin-bottom:8px}
.edu .prog i{display:block;height:100%;background:var(--in)}
.edu .people{display:flex;flex-wrap:wrap;gap:4px}
.who2b{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);
       background:var(--bg);color:var(--dim);cursor:pointer;user-select:none}
.who2b.done{background:var(--in);border-color:var(--in);color:#fff;font-weight:600}

/* ── 담당자별 보기 ── */
.whobar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--keep);color:#fff;
        border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:13.5px}
.whobar b{font-size:15px}
.whobar .spacer{flex:1}
.whobar button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
               font-size:12.5px;padding:4px 11px}
.whobar button:hover{background:rgba(255,255,255,.28)}
.wholist{display:flex;flex-direction:column;gap:2px}
.whoitem{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 7px;border-radius:7px;cursor:pointer}
.whoitem:hover{background:var(--chip)}
.whoitem.me{font-weight:700}
.whoitem .nm2{flex:1}
.whoitem .qty{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
.whoitem .mini2{height:6px;border-radius:3px;background:var(--keep);flex:none}

/* ── 선택 칩 (담당·재원·요일) ── */
.pickrow{display:flex;flex-wrap:wrap;gap:5px;padding:7px 0 2px}
.pick{font-size:12.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
      background:var(--bg);color:var(--dim);cursor:pointer;user-select:none}
.pick:hover{border-color:var(--dim)}
.pick.on{background:var(--keep);border-color:var(--keep);color:#fff;font-weight:600}
.pick.add{border-style:dashed}
#ruleTabs button{font-size:12.5px;padding:5px 11px}
.rulebox{padding:2px 0 4px}

/* ── 연락처 ── */
.sos{border:1px solid var(--warn);border-left-width:4px;border-radius:10px;background:var(--card);
     padding:13px 16px;margin-bottom:16px}
.sos>b{display:block;font-size:12px;color:var(--warn);letter-spacing:.05em;margin-bottom:9px}
.ctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px}
.ct{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;position:relative}
.ct.sosc{border-left:4px solid var(--warn)}
.ct h4{margin:0 0 3px;font-size:14.5px;padding-right:22px;line-height:1.3}
.ct .cat{font-size:11px;color:var(--dim);margin-bottom:7px}
.ct .tel{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
         display:block;margin-bottom:2px;color:var(--keep);text-decoration:none}
.ct .tel:hover{text-decoration:underline}
.ct .none2{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:2px}
.ct .em{font-size:12.5px;color:var(--dim);word-break:break-all}
.ct .memo{font-size:12.5px;color:var(--ink);margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.ct .link2{display:inline-block;font-size:12px;margin-top:7px;color:var(--keep);cursor:pointer}
.ct .link2:hover{text-decoration:underline}
.ct .pin{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;
         font-size:13px;color:var(--line);padding:2px 4px;line-height:1}
.ct .pin.on{color:#e8b84b}
.ct .acts{margin-top:9px;display:flex;gap:5px}
.ct .acts button{font-size:11.5px;padding:3px 8px}

/* ── 문서함 ── */
.dcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 15px}
.dcard.ok{border-color:var(--in)}
.dcard h4{margin:0 0 5px;font-size:14.5px}
.dcard .sc{font-size:12px;color:var(--dim);margin-bottom:6px}
.dcard p{margin:0 0 8px;font-size:13px}
.dcard a{color:var(--keep);font-size:12.5px;word-break:break-all}
.dcard label{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;color:var(--dim)}

/* ── 업무 캡처 사진 ── */
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.shot{position:relative;width:112px}
.shot img{width:112px;height:76px;object-fit:cover;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;display:block;background:var(--chip)}
.shot .cap{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.3;word-break:break-all}
.shot .del{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:none;border-radius:4px;
  width:18px;height:18px;line-height:1;font-size:12px;padding:0;cursor:pointer;display:none}
.shot:hover .del{display:block}
.shotbar{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.shotbar small{color:var(--dim);font-size:11.5px}
#zdlg{padding:0;border:none;background:transparent;max-width:96vw;max-height:94vh}
#zdlg img{max-width:92vw;max-height:84vh;border-radius:8px;display:block}
#zdlg .zcap{background:var(--card);color:var(--ink);font-size:12.5px;padding:8px 12px;border-radius:0 0 8px 8px}

/* ── 캘린더 담당자 필터 ── */
.whofilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.whofilter>b{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-right:2px}
.wf{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg);color:var(--dim);cursor:pointer;user-select:none}
.wf.on{background:var(--keep);border-color:var(--keep);color:#fff;font-weight:600}
.wf.on.me{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.wf small{opacity:.8;margin-left:3px;font-size:10.5px}
.whofilter .mini{font-size:11.5px;padding:3px 9px}

/* ── 대시보드 ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:11px;color:var(--dim);letter-spacing:.04em;margin-bottom:5px;font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:12px;font-weight:400;color:var(--dim);margin-left:4px}
.kpi .sub2{font-size:11.5px;color:var(--dim);margin-top:4px}
.kpi.warn .v{color:var(--warn)}
.kpi.ok .v{color:var(--in)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.panel>h3{margin:0 0 10px;font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.panel>h3 small{font-weight:400;color:var(--dim);font-size:11.5px}
.li{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-of-type{border-top:none}
.li:hover{background:var(--chip)}
.li .d{flex:none;font-size:11px;color:var(--warn);font-variant-numeric:tabular-nums;min-width:62px}
.li .x{flex:1}
.li .x small{display:block;color:var(--dim);font-size:11px}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:flex;gap:8px;align-items:center;font-size:12.5px}
.barrow span:first-child{min-width:64px;color:var(--dim);font-size:11.5px}
.pbar{flex:1;height:16px;background:var(--chip);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--keep)}
.pbar i.out{background:var(--out)} .pbar i.in{background:var(--in)} .pbar i.ok{background:var(--in)}
.barrow b{min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.pillrow{display:flex;flex-wrap:wrap;gap:5px}

/* ── 전체 출력 ── */
.cover{text-align:center;padding:70px 20px 50px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:22px}
.cover h2{font-size:27px;letter-spacing:.22em;margin:0 0 10px}
.cover .who2{font-size:14px;color:var(--dim);margin-bottom:26px}
.cover table{max-width:430px;margin:0 auto;font-size:13px;min-width:0}
.cover td{border:1px solid var(--line);padding:6px 10px}
.cover td:first-child{background:var(--chip);color:var(--dim);width:120px;font-size:12px}
.page{margin-bottom:30px}
.page>h2.pt{font-size:17px;margin:0 0 14px;padding:8px 12px;background:var(--accent);color:var(--bg);border-radius:7px}
.page>h2.pt small{font-weight:400;opacity:.75;font-size:12px;margin-left:8px}
.toc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:22px}
.toc b{font-size:12px;color:var(--dim);display:block;margin-bottom:7px}
.toc ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink)}

/* ── 담당자 칩 · 인계 ── */
.who{background:var(--chip);border:1px solid var(--line);color:var(--ink);font-size:11.5px;
  padding:2px 8px;border-radius:20px;cursor:pointer;display:inline-block;margin:1px 3px 1px 0;white-space:nowrap}
.who:hover{border-color:var(--keep);color:var(--keep)}
.who.me{border-color:var(--keep);color:var(--keep);font-weight:600}
#obody h3{margin:0 0 4px;font-size:17px}
#obody .cnt{font-size:12.5px;color:var(--dim);margin-bottom:12px}
#obody fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px}
#obody legend{font-size:11.5px;color:var(--dim);padding:0 5px}
#obody .pick{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:3px 0;cursor:pointer}
#obody .pick input{margin-top:4px;flex:none}
#obody .pick small{color:var(--dim);display:block;font-size:11px}
.hist{font-size:11.5px;color:var(--dim);margin-top:6px}
.hist b{color:var(--in)}

/* ── 상태 칩 ── */
.st{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;display:inline-block}
.st[data-s="완료"]{background:var(--in);color:#fff;border-color:transparent}
.st[data-s="진행중"]{background:var(--keep);color:#fff;border-color:transparent}
.st[data-s="인수중"]{background:var(--in);color:#fff;border-color:transparent;opacity:.75}
.st[data-s="인계중"]{background:var(--out);color:#fff;border-color:transparent;opacity:.85}
.st[data-s="추가확인"]{background:var(--tbd);color:#fff;border-color:transparent}
.st[data-s="보류"]{color:var(--dim)}

/* ── AS-IS / TO-BE ── */
.shift{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.shift{grid-template-columns:1fr}}
.col2{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.col2>h3{margin:0 0 3px;font-size:15px}
.col2>.cap{font-size:12px;color:var(--dim);margin-bottom:12px}
.col2 h4{margin:14px 0 6px;font-size:12px;color:var(--dim);letter-spacing:.04em}
.col2 h4:first-of-type{margin-top:0}
.trow{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:hover{background:var(--chip)}
.trow .nmx{flex:1}
.trow small{color:var(--dim);font-size:11px}
.gone{opacity:.55}
.gone .nmx{text-decoration:line-through}
.sumbar{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:14px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.sumbar b{font-size:17px;margin-right:4px}

/* ── 업무 상세 ── */
#tbody h3{margin:0 0 6px;font-size:17px}
#tbody .meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
#tbody section{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
#tbody section>b{display:block;font-size:11px;color:var(--dim);letter-spacing:.05em;margin-bottom:5px}
#tbody ol,#tbody ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}
#tbody ul.trap li{color:var(--warn)}
.node[data-person]{cursor:pointer}
.node[data-person]:hover{border-color:var(--keep);background:var(--chip)}
.node.me{border-color:var(--keep);border-width:2px}
#pbody .pcard{border:none;padding:0}
#pbody .pcard ol{font-size:13px;color:var(--ink)}
.node.vac{border-style:dashed;opacity:.7}
.conn{width:1px;height:16px;background:var(--line);margin:0 auto}
.branch{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:4px}
.col{min-width:190px;flex:1;max-width:280px}
.col>.node{background:var(--chip);font-weight:600;margin-bottom:10px}
.col .members{display:flex;flex-direction:column;gap:7px}
.orgnote{font-size:12px;color:var(--dim);margin:0 0 14px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(620px,94vw)}
dialog::backdrop{background:#0009}
label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 3px}
input[type=text],select,textarea{width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>div{flex:1;min-width:170px}

@media (max-width:640px){
  body{padding-left:12px;padding-right:12px}
  h1{font-size:19px}
  button{font-size:12px;padding:5px 9px}
  .bar{gap:5px}
  .bar.views .spacer{display:none}
  #q{width:100%}
  .kpis{grid-template-columns:1fr 1fr}
  .shift{grid-template-columns:1fr}
}

@media print{
  @page{margin:14mm 12mm}
  body{max-width:none;padding:0;font-size:9.5pt}
  .bar,.act,.addlog,.logrow button,h1,.sub,.calnote,.orgnote,.shotbar,.who,.docbar,.no-print,
  nav,#navToggle{display:none}
  .shell{display:block} .content{padding:0;max-width:none}
  .page{break-after:page;margin-bottom:0}
  .page:last-child{break-after:auto}
  .page>h2.pt{background:none!important;color:#000!important;border-bottom:2px solid #000;border-radius:0;padding:0 0 4px;font-size:14pt}
  .cover{break-after:page;border:none;padding:120px 0 0}
  .toc{break-after:page;border:none}
  .shift{grid-template-columns:1fr 1fr;gap:10px}
  .col2,.sumbar,.strip,.mon,.dcard,.pcard,.dept,.node{border-color:#999;break-inside:avoid}
  .pgrid{grid-template-columns:1fr 1fr}
  .calgrid{grid-template-columns:1fr 1fr 1fr}
  .cal{min-width:0;font-size:7.5pt}
  .cell{min-height:60px}
  .ev{white-space:normal}
  .tblwrap{overflow:visible;border-color:#999} table{min-width:0;font-size:8.5pt} th{position:static}
  .trow{break-inside:avoid}
  .grid{display:block} .card{break-inside:avoid;border:1px solid #999;margin-bottom:8px;padding:10px}
  .step input{-webkit-appearance:none;appearance:none;width:11px;height:11px;border:1px solid #666;display:inline-block}
  .doc{border:none;padding:0;max-width:none}
  .tblwrap{border:none;overflow:visible} table{min-width:0} th{position:static}
  .grp>h3{color:#000;background:none!important;border-bottom:2px solid #000;border-radius:0;padding-left:0}
  .mon{break-inside:avoid;border:1px solid #999}
}

function normalize(db){
  (db.tasks||[]).forEach(t=>{
    if(!t.status) t.status = DEFSTAT[t.type] || "미착수";
    if(!t.next) t.next = [];
    if(!t.files) t.files = [];
    if(!t.shots) t.shots = [];
  });
  return db;
}

// 저장할 때마다 스냅샷을 쌓는다. 용량이 넘치면 오래된 것부터 버린다.
const BKKEY = "eopmu_backup_v1", BKMAX = 8;
function bkLoad(){ try{ return JSON.parse(localStorage.getItem(BKKEY)) || []; }catch(e){ return []; } }
function bkStamp(json){
  let db = {};
  try{ db = JSON.parse(json); }catch(e){}
  return {t: new Date().toISOString(), n: {
    업무: (db.tasks||[]).length, 일정: (db.events||[]).length,
    연락처: (db.contacts||[]).length, 문서: (db.docs||[]).length,
    절차: (db.tasks||[]).filter(x=>(x.steps||[]).length).length,
  }, d: json};
}
// 인자는 «저장 직전까지 유지되던» 상태의 JSON 문자열
function bkPush(json){
  if(!json) return;
  let list = bkLoad();
  const snap = bkStamp(json);
  const last = list[list.length-1];
  if(last && last.d === snap.d) return;          // 내용이 같으면 쌓지 않는다
  list.push(snap);
  while(list.length > BKMAX) list.shift();
  // 용량 초과면 오래된 것부터 버리며 재시도
  for(;;){
    try{ localStorage.setItem(BKKEY, JSON.stringify(list)); return; }
    catch(e){
      if(list.length <= 1){ try{ localStorage.removeItem(BKKEY); }catch(e2){} return; }
      list.shift();
    }
  }
}
function bkSize(){
  try{ return ((localStorage.getItem(BKKEY)||"").length/1048576).toFixed(2); }catch(e){ return "?"; }
}

      + list.length + "개 · " + bkSize() + "MB"
    : "아직 백업이 없습니다. 무언가 저장하면 자동으로 쌓입니다.";

  }).join('') : '<div class="none">없음</div>';
}

const COLS = [

  ["_files","관련 문서"], ["_shots","캡처"], ["_steps","절차"], ["_log","기록"]

function cellval(x,k){
  if(k==="type") return TORDER[x.type];
  if(k==="systems") return (x.systems||[]).join(", ");
  if(k==="_grp") return catGroupOf(x.cat);
  if(k==="_files") return (x.files||[]).join(", ");
  if(k==="_shots") return (x.shots||[]).length;
  if(k==="_steps") return (x.steps||[]).length;
  if(k==="_log") return (x.log||[]).length;
  return x[k]||"";
}
function viewTable(list){
  const rows = list.slice();
  if(sortKey) rows.sort((a,b)=>{
    const A=cellval(a,sortKey), B=cellval(b,sortKey);
    return (A>B?1:A<B?-1:0)*sortDir;
  });
  else rows.sort((a,b)=>TORDER[a.type]-TORDER[b.type] || (a.cat>b.cat?1:-1));
  return '<div class="tblwrap"><table><thead><tr>'
    + COLS.map(c=>'<th data-sort="'+c[0]+'">'+c[1]+(sortKey===c[0]?(sortDir>0?' ▲':' ▼'):'')+'</th>').join('')
    + '</tr></thead><tbody>'
    + rows.map(x=>'<tr>'
      + '<td><span class="chip '+x.type+'">'+TN[x.type]+'</span></td>'

// ponytail: 기한 문자열 정규식 파싱. 자유서술은 '기타'로 떨어짐 — 형식 늘면 여기 패턴 추가
function parseDeadline(s){
  const out = [];
  if(!s) return out;
  if(/매일/.test(s)) out.push({kind:"daily"});
  let m, re = /매월\s*(\d{1,2})\s*일/g;
  while((m = re.exec(s))) out.push({kind:"monthly", d:+m[1]});
  re = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/g;
  while((m = re.exec(s))) out.push({kind:"yearly", m:+m[1], d:+m[2]});
  re = /(\d{1,2})\s*월\s*중/g;
  while((m = re.exec(s))) out.push({kind:"yearly", m:+m[1], d:0});
  if(!out.length){ // 일자 없이 '12월' 처럼 월만 적힌 경우 → 그 달 1일 칸에 표시
    re = /(?:^|[^매\d])(\d{1,2})\s*월/g;
    while((m = re.exec(s))){ const mm=+m[1]; if(mm>=1 && mm<=12) out.push({kind:"yearly", m:mm, d:0}); }
  }
  if(!out.length) out.push({kind:"other", text:s});
  return out;
}
/* ─────────── Supabase 공유 저장소 ─────────── */
// 앱 전체 상태를 단일 문서로 주고받는다. rev 로 동시 편집 충돌을 막고,
// 충돌이 나면 덮어쓰지 않고 최신본을 받아 사용자가 선택하게 한다.
const SB_CFG = /*__SUPABASE__*/null;
let sb = null, sbUser = null, sbRev = 0, sbBusy = false, sbDirty = false;

function syncShow(text, cls, sub2){
  if(typeof syncState === "undefined" || !syncState) return;
  syncState.className = "syncstate" + (cls ? " " + cls : "");
  syncState.innerHTML = "<b>" + esc(text) + "</b>" + (sub2 ? esc(sub2) : "");
}
function syncInit(){
  if(!SB_CFG || !window.supabase){
    if(typeof syncGrp !== "undefined" && syncGrp) syncGrp.hidden = true;
    return;
  }
  sb = window.supabase.createClient(SB_CFG.url, SB_CFG.anonKey);
  sb.auth.getSession().then(({data})=>{
    if(data && data.session){ sbUser = data.session.user; afterLogin(); }
    else syncShow("로그인 필요", "", "이 기기에만 저장 중");
  });
}
async function afterLogin(){
  syncShow("연결됨", "on", sbUser.email);
  syncBtn.textContent = "로그아웃";
  pullBtn.hidden = pushBtn.hidden = false;
  await pullState(true);
  // 다른 사람이 저장하면 알려준다
  sb.channel("app_state")
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"app_state"}, p=>{
      if(p.new && p.new.rev !== sbRev) syncShow("새 버전 있음", "err",
        (p.new.updated_by || "누군가") + " 가 저장함 · 불러오기 누르기");
    }).subscribe();
}
async function pullState(silent){
  if(!sb) return;
  const {data, error} = await sb.from("app_state").select("data,rev,updated_at,updated_by")
    .eq("id", SB_CFG.stateId).maybeSingle();
  if(error){ syncShow("불러오기 실패", "err", error.message); return; }
  if(!data){
    if(!silent && confirm("공유 저장소가 비어 있습니다.\n지금 내 데이터를 올려서 시작할까요?")) await pushState("최초 등록");
    else syncShow("저장소 비어 있음", "", "«지금 올리기» 로 시작");
    return;
  }
  sbRev = data.rev;
  DB = normalize(data.data);
  lastSaved = JSON.stringify(DB);
  try{ localStorage.setItem(KEY, lastSaved); }catch(e){}
  sbDirty = false;
  syncShow("연결됨", "on", "rev " + sbRev + " · " + (data.updated_by || "") );
  render();
  if(!silent) alert("공유 저장소에서 불러왔습니다. (rev " + sbRev + ")");
}
async function pushState(note){
  if(!sb || sbBusy) return;
  sbBusy = true;
  const {data, error} = await sb.rpc("save_state", {
    p_id: SB_CFG.stateId, p_data: JSON.parse(JSON.stringify(DB)),
    p_rev: sbRev, p_by: (sbUser && sbUser.email) || null, p_note: note || null
  });
  sbBusy = false;
  if(error){ syncShow("저장 실패", "err", error.message); return; }
  const row = Array.isArray(data) ? data[0] : data;
  if(row && row.ok){
    sbRev = row.rev; sbDirty = false;
    syncShow("연결됨", "on", "rev " + sbRev + " · 방금 저장");
  }else{
    sbDirty = true;
    syncShow("충돌", "err", "다른 사람이 먼저 저장함 (rev " + (row && row.rev) + ")");
    if(confirm("다른 사람이 먼저 저장했습니다.\n\n확인 = 그쪽 최신본을 불러옵니다 (내 변경은 백업에 남습니다)\n취소 = 아무것도 하지 않습니다"))
      await pullState(true);
  }
}
// 저장할 때마다 자동으로 올린다 (잠깐 모았다가)
let pushTimer = null;
function syncQueue(){
  if(!sb || !sbUser) return;

const CMTS = () => DB.committees || [];
const dleft = iso => {
  const m = parseISO(iso); if(!m) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(m.y, m.m-1, m.d) - t) / 86400000);
};
function termCell(mb){
  if(!mb.end) return '<span class="none">임기 미기재</span>';
  const d = dleft(mb.end);
  const cls = d === null ? "" : d < 0 ? " over" : d <= 90 ? " soon" : "";
  const tag = d === null ? "" : d < 0 ? " · 만료 " + (-d) + "일 경과" : " · D-" + d;
  return '<span class="term' + cls + '">' + esc(mb.start||"") + " ~ " + esc(mb.end) + tag + '</span>';
}
function viewCmt(){

const EDUS = () => EVENTS().filter(e=>e.cat==="의무교육" || e.cat==="교육");
function eduTargets(e){
  const t = e.target || "전 직원";
  const all = (DB.people||[]).filter(p=>p.name!=="(공석)");
  if(t.indexOf("사무국") >= 0) return all.filter(p=>p.dept==="사무행정실").map(p=>p.name);
  if(t.indexOf("PAS") >= 0 || t.indexOf("전담") >= 0)
    return all.filter(p=>p.team==="PAS팀" || p.dept==="사회서비스실").map(p=>p.name);
  if(t.indexOf("활동지원사") >= 0) return [];   // 명단이 앱에 없음
  return all.map(p=>p.name);
}

// 업무(기한) + 일정(만기)을 한 배열로. kind: 업무는 type, 일정은 cat
function agenda(){
  const out = [];
  DB.tasks.forEach(t=>{ if(t.deadline) parseDeadline(t.deadline).forEach(p=>
    out.push({p, id:t.id, ref:"task", k:(t.type==="out"||t.type==="in")?t.type:"task",
              owner:t.counterpart, title:t.name,
              sub:TN[t.type]+(t.counterpart?" · "+t.counterpart:"")})); });
  // rule 이 있으면 그것을 우선 (매월/매주/매년)
  EVENTS().forEach(e=>{ const R = e.rule; if(!R) return;
    const sub2 = e.cat+(e.owner?" · "+e.owner:"")+(e.status&&e.status!=="예정"?" · "+e.status:"");
    const base = {id:e.id, ref:"event", k:e.cat, owner:e.owner, title:e.title, sub:sub2};
    if(R.kind==="weekly") (R.days||[]).forEach(d=>out.push(Object.assign({p:{kind:"weekly", w:d}}, base)));
    else if(R.kind==="months") (R.months||[]).forEach(m=>out.push(Object.assign({p:{kind:"yearly", m:m, d:R.d||0}}, base)));
    else out.push(Object.assign({p:R}, base));
  });
  EVENTS().forEach(e=>{ if(e.rule) return; const st = parseISO(e.date);
    if(st){ const en = parseISO(e.end) || st;
      let cur = new Date(st.y, st.m-1, st.d), last = new Date(en.y, en.m-1, en.d), i = 0;
      while(cur <= last && i++ < 60){
        out.push({p:{kind:"date", y:cur.getFullYear(), m:cur.getMonth()+1, d:cur.getDate()},
          id:e.id, ref:"event", k:e.cat, owner:e.owner, title:e.title,
          sub:e.cat+(e.owner?" · "+e.owner:"")+(e.status&&e.status!=="예정"?" · "+e.status:"")});
        cur = new Date(cur.getTime()+86400000);
      }
      return;
    }
    if(e.due) parseDeadline(e.due).forEach(p=>
    out.push({p, id:e.id, ref:"event", k:e.cat, owner:e.owner, title:e.title,
              sub:e.cat+(e.owner?" · "+e.owner:"")+(e.status&&e.status!=="예정"?" · "+e.status:"")})); });
  EVENTS().forEach(e=>{ if(!e.due && !e.date && !e.rule)
    out.push({p:{kind:"other",text:e.status||"날짜 미상"}, id:e.id, ref:"event", k:e.cat,
              owner:e.owner, title:e.title, sub:e.cat+(e.status?" · "+e.status:"")}); });
  return out;
}

      + cells + '</div></div>'

    + '<div class="legend">'
      + lg("var(--keep)","내 업무 기한") + lg("var(--out)","인계 업무") + lg("var(--in)","인수 업무")
      + lg("#b45309","신고·보고") + lg("#7c3aed","보험·구독 만기")
      + lg("var(--warn)","지도점검·평가") + lg("var(--common)","회의·내부점검")

/* ─────────── 캘린더 담당자 필터 ─────────── */
// 업무는 내 기준 데이터라 담당을 이렇게 본다: 유지·미정=나, 인계=나+인수자, 인수=인계자+나, 공통=공통
let calWho = null;   // null = 전체 표시. Set 이면 그 담당만.

// ── 담당자별 보기: 앱 전체를 한 사람 기준으로 좁힌다 ──
const WHOKEY = "eopmu_who_v1";
let whoFilter = null;
try{ whoFilter = localStorage.getItem(WHOKEY) || null; }catch(e){}

// 업무의 담당자 — owner 가 있으면 그것, 없으면 내 기준 구분에서 유도
function taskOwners(t){
  if(t.owner) return splitOwner(t.owner);
  if(t.type === "common") return (DB.people||[]).map(p=>p.name).filter(n=>n!=="(공석)");
  return [ME].concat(splitOwner(t.counterpart));
}
const taskOfWho = (t, n) => taskOwners(t).indexOf(n) >= 0;
const eventOfWho = (e, n) => splitOwner(e.owner).indexOf(n) >= 0;

function setWho(n){
  whoFilter = n || null;
  try{ n ? localStorage.setItem(WHOKEY, n) : localStorage.removeItem(WHOKEY); }catch(e){}
  render();
}
function whoBar(){
  if(!whoFilter) return "";
  const nt = DB.tasks.filter(t=>taskOfWho(t, whoFilter)).length;
  const ne = EVENTS().filter(e=>eventOfWho(e, whoFilter)).length;
  return '<div class="whobar"><b>' + esc(whoFilter) + '</b> 담당만 보는 중'
    + ' — 업무 ' + nt + '건 · 일정 ' + ne + '건'
    + '<span class="spacer"></span>'
    + '<button data-who="">전체 보기로</button></div>';
}

function itemOwners(a){
  if(a.ref === "event"){
    const o = splitOwner(a.owner);
    return o.length ? o : ["미지정"];
  }
  const t = byId(a.id); if(!t) return ["미지정"];
  if(t.type === "common") return ["공통"];
  const cp = splitOwner(t.counterpart);
  return [ME].concat(cp);
}
function ownerTally(list){
  const m = new Map();
  list.forEach(a => itemOwners(a).forEach(o => m.set(o, (m.get(o)||0)+1)));
  return [...m.entries()].sort((x,y)=>
    (x[0]===ME?-1:y[0]===ME?1:0) || y[1]-x[1] || (x[0]>y[0]?1:-1));
}
const whoOn = o => !calWho || calWho.has(o);
const passWho = a => !calWho || itemOwners(a).some(o=>calWho.has(o));

function whoFilterBar(list){
  const tally = ownerTally(list);
  return '<div class="whofilter"><b>담당자</b>'
    + '<span class="wf mini'+(calWho?'':' on')+'" data-wf="*">전체 '+list.length+'</span>'
    + '<span class="wf mini" data-wf="@me">나만</span>'
    + tally.map(([o,c])=>'<span class="wf'+(whoOn(o)?' on':'')+(o===ME?' me':'')+'" data-wf="'+esc(o)+'">'
        + esc(o)+'<small>'+c+'</small></span>').join('')
    + '</div>';
}

const iso = d => d.toISOString().slice(0,10);
const parseISO = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||"");
  return m ? {y:+m[1], m:+m[2], d:+m[3]} : null; };

function fundOptions(){
  const set = new Set();
  EVENTS().forEach(e=>(e.fund||"").split(/[,/·]/).forEach(f=>{ f=f.trim(); if(f) set.add(f); }));

// 반복 규칙 -> 사람이 읽는 기한 문자열 (기존 데이터와 같은 표기)
function ruleToDue(f){
  if(evRule === "date") return f.date.value || "";
  if(evRule === "monthly") return "매월 " + (f.rmDay.value||1) + "일";
  if(evRule === "weekly") return evDows.length ? "매주 " + evDows.slice().sort().map(d=>DOW[d]).join("·") + "요일" : "";
  if(evRule === "yearly") return (f.ryMon.value||1) + "월" + (+f.ryDay.value ? " " + f.ryDay.value + "일" : " 중");
  return f.due.value.trim();
}
function ruleObj(f){
  if(evRule === "monthly") return {kind:"monthly", d:+f.rmDay.value || 1};
  if(evRule === "weekly") return {kind:"weekly", days:evDows.slice().sort()};
  if(evRule === "yearly") return {kind:"yearly", m:+f.ryMon.value || 1, d:+f.ryDay.value || 0};
  return null;   // date / text 는 기존 date·due 필드로 처리
}

  editingEv = ev || null;

  f.detail.value=g("detail",""); f.system.value=g("system","");
  f.status.value=g("status","예정"); f.note.value=g("note","");
  f.mkTask.checked = false;

  evOwners = splitOwner(g("owner",""));
  evFunds = (g("fund","")||"").split(/[,/·]/).map(x=>x.trim()).filter(Boolean);

// 오늘 기준 앞으로 N일 안에 도래하는 회차를 계산 (매월/연간 반복 포함)
function nextDue(pp, from){
  const t = from || new Date(); t.setHours(0,0,0,0);
  if(pp.kind==="date") return new Date(pp.y, pp.m-1, pp.d);
  if(pp.kind==="weekly"){
    const c = new Date(t); c.setDate(t.getDate() + ((pp.w - t.getDay() + 7) % 7));
    return c;
  }
  if(pp.kind==="monthly"){
    let c = new Date(t.getFullYear(), t.getMonth(), pp.d);
    if(c < t) c = new Date(t.getFullYear(), t.getMonth()+1, pp.d);
    return c;
  }
  if(pp.kind==="yearly"){
    let c = new Date(t.getFullYear(), pp.m-1, pp.d||1);
    if(c < t) c = new Date(t.getFullYear()+1, pp.m-1, pp.d||1);
    return c;
  }
  return null;
}
const DAY = 86400000;
function upcoming(days){
  const t = new Date(); t.setHours(0,0,0,0);
  return agenda().map(a=>{ const n = nextDue(a.p, t); return n ? {a, n, dd: Math.round((n-t)/DAY)} : null; })
    .filter(x=>x && x.dd>=0 && x.dd<=days)
    .sort((x,y)=>x.n-y.n);
}

function saveDocAsWord(){
  const paper = document.getElementById("docPaper");
  if(!paper){ alert("인수인계서 보기에서만 저장할 수 있습니다."); return; }
  const css = 'body{font-family:"\ub9d1\uc740 \uace0\ub515",sans-serif;font-size:10.5pt;color:#000}'
    + 'h2{text-align:center;letter-spacing:.25em;font-size:18pt;margin:0 0 6pt}'
    + '.docmeta{text-align:center;color:#666;font-size:9pt;margin-bottom:14pt}'
    + 'table{border-collapse:collapse;width:100%;font-size:9.5pt;margin-bottom:12pt}'
    + 'th,td{border:1px solid #999;padding:4pt 6pt;text-align:left;vertical-align:top}'
    + 'th{background:#f1efe9}'
    + '.grp>h3{font-size:12pt;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin:16pt 0 8pt}'
    + '.item{border:1px solid #bbb;padding:7pt 9pt;margin-bottom:8pt;page-break-inside:avoid}'
    + '.item h4{margin:0 0 4pt;font-size:11pt}'
    + 'dt{color:#666;font-size:8.5pt}dd{margin:0 0 3pt}'
    + 'ol,ul{margin:2pt 0 2pt 16pt;padding:0}'
    + '.none{color:#999;font-style:italic}'
    + '.blank{display:block;border-bottom:1px dotted #999;min-height:14pt}'
    + '.shots img{max-width:320px;border:1px solid #bbb}';
  // 서명란은 표로 바꿔야 Word 에서 칸이 유지된다
  const clone = paper.cloneNode(true);
  clone.querySelectorAll('.item.unpicked, .no-print').forEach(el=>el.remove());
  clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  const sign = clone.querySelector(".sign");
  if(sign){
    const cells = [...sign.querySelectorAll("div")];
    const tb = document.createElement("table");
    tb.innerHTML = "<tr>" + cells.map(c=>"<th>" + ((c.querySelector("b")||{}).textContent||"") + "</th>").join("")
      + "</tr><tr>" + cells.map(c=>"<td style='height:34pt'>" + ((c.querySelector("span")||{}).textContent||"") + "</td>").join("") + "</tr>";
    sign.replaceWith(tb);
  }
  const who = docWho === "all" ? "\uc804\uccb4" : docWho;
  const html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "
    + "xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>"
    + "<head><meta charset='utf-8'><title>" + esc(who) + "</title>"
    + "<style>@page{size:A4;margin:18mm 15mm}" + css + "</style></head><body>"
    + clone.innerHTML + "</body></html>";
  const blob = new Blob(["\ufeff" + html], {type:"application/msword"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "\uc778\uc218\uc778\uacc4\uc11c_" + who + "_" + today() + ".doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

    + page(6, viewDept())
    + page(7, viewPerson())
    + page(8, viewDocs());
  filter = keepF; query = keepQ; evCat = keepC;
  return out;
}

// 정기 일정을 담당자별 업무로 등록. 내가 담당이면 «유지», 남이면 «타 담당»으로 들어간다.
function makeTasksFromEvent(ev){
  const owners = splitOwner(ev.owner);
  const targets = owners.length ? owners : [ME];
  let made = 0;
  targets.forEach(who=>{
    if(DB.tasks.some(t=>t.srcEvent===ev.id && (t.owner||ME)===who)) return;
    const mine = who === ME;
    DB.tasks.push({
      id:"t"+Date.now()+"-"+made, srcEvent:ev.id, owner:who,
      name:ev.title, cat:ev.cat, cycle:ev.due || "", type: mine ? "keep" : "other",
      counterpart: mine ? "" : who, deadline:ev.due || "", desc:ev.detail || "",
      status: mine ? "진행중" : "미착수",
      systems:[ev.system].filter(Boolean), steps:[], files:[], shots:[],
      assets:(ev.fund ? ["재원: "+ev.fund] : []), traps:[], next:[],
      log:[{d:today(), t:"일정에서 업무 등록 · 담당 "+who}], done:[]
    });
    made++;
  });
  if(made) alert("업무분장에 " + made + "건 추가 (담당: " + targets.join(", ") + ")");
}

// 일정 -> 업무로 등록 (일정과 업무를 한 흐름으로 묶기)
function eventToTask(id){
  const e = byEid(id); if(!e) return;
  if(DB.tasks.some(t=>t.srcEvent===id)){ alert("이미 업무로 등록된 일정"); return; }
  const mine = splitOwner(e.owner).indexOf(ME)>=0;
  DB.tasks.push({

    type: mine ? "keep" : "in", counterpart: mine ? "" : (splitOwner(e.owner)[0] || ""),
    deadline: e.due || "", desc: e.detail || "", status: mine ? "진행중" : "인수중",
    systems: [e.system].filter(Boolean), steps: [], files: [], shots: [],
    assets: [e.fund ? "재원: " + e.fund : ""].filter(Boolean),

}

/* ─────────── 업무 캡처 사진 ─────────── */
// ponytail: localStorage 한도(≈5MB) 때문에 긴 변 1200px / JPEG 0.75 로 줄여 저장.
// 원본 화질이 필요하면 캡처/ 폴더에 파일을 두고 shots[].src 에 상대경로를 넣으면 그대로 표시됨.
const MAXW = 1200, JPEGQ = 0.75;

function shrink(file){
  return new Promise((ok, no)=>{
    const fr = new FileReader();
    fr.onerror = no;
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = no;
      im.onload = ()=>{
        const sc = Math.min(1, MAXW/im.width);
        const c = document.createElement("canvas");
        c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", JPEGQ));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function dbSizeMB(){ try{ return (JSON.stringify(DB).length/1048576).toFixed(2); }catch(e){ return "?"; } }

async function addShots(id, files){
  const x = byId(id); if(!x) return;
  x.shots = x.shots || [];
  for(const f of files){
    if(!/^image\//.test(f.type)) continue;
    try{ x.shots.push({src: await shrink(f), t: f.name.replace(/\.[^.]+$/, "")}); }
    catch(e){ alert("이미지 처리 실패: " + f.name); }
  }
  if(+dbSizeMB() > 4.5) alert("저장 용량 " + dbSizeMB() + "MB — 브라우저 한도(약 5MB)에 근접.\n"
    + "JSON 내보내기로 백업하고, 오래된 캡처는 지우거나 캡처/ 폴더 방식으로 옮길 것.");
  save();
}

const DEPTS = (DB.org && DB.org.length) ? DB.org
  : ["구로IL센터","사무국","사회서비스실","PAS팀","사무행정실","복지사업팀"];
const RANKS = ["대표","소장","사무국장","실장","팀장","사회복지사","간사"];
const dOrd = d => { const i = DEPTS.indexOf(d); return i<0 ? 99 : i; };
const rOrd = r => { const i = RANKS.indexOf(r); return i<0 ? 99 : i; };
const roster = () => (DB.people||[]).slice().sort((a,b)=>
  dOrd(a.dept)-dOrd(b.dept) || rOrd(a.rank)-rOrd(b.rank) || (a.name>b.name?1:-1));

  let list = roster();

}

function openPerson(key){
  const p = (DB.people||[])[+key];
  if(!p) return;
  pbody.innerHTML = pcard(p);
  pdlg.showModal();
}

function viewOrg(){
  const all = roster();
  const pick = (dept, rank) => all.filter(p=>p.dept===dept && (!rank || p.rank===rank));
  const node = (p, cls) => p ? '<div class="node'+(p.name===ME?' me':'')+(p.name==="(공석)"?' vac':'')+(cls?' '+cls:'')+'"'
      + ' data-person="'+DB.people.indexOf(p)+'" title="클릭하면 담당업무">'
      + '<b>'+esc(p.name)+(p.name===ME?' ★':'')+'</b>'
      + '<small>'+esc(p.rank)+(p.team?' · '+esc(p.team):'')+(p.role?' · '+esc(p.role.split(",")[0]):'')+'</small></div>' : '';
  const head = (d,r)=>pick(d,r)[0];
  const col = dept => {
    const ppl = all.filter(p=>p.dept===dept);
    return '<div class="col"><div class="node">'+esc(dept)+'<small>'+ppl.length+'명</small></div>'
      + '<div class="members">'+ppl.map(p=>node(p)).join('')+'</div></div>';
  };
  return '<div class="orgnote">기준 2026.09.01. 업무분장표. ★ = 나('+esc(ME)+'), 점선 = 공석.</div>'
    + '<div class="org">'
    + '<div class="tier">'+node(head("구로IL센터","대표"))+'</div><div class="conn"></div>'
    + '<div class="tier">'+node(head("사무국","소장"))+'</div><div class="conn"></div>'
    + '<div class="tier">'+node(head("사무국","사무국장"))+'</div><div class="conn"></div>'
    + '<div class="branch">'
      + DEPTS.filter(d=>d!=="구로IL센터" && d!=="사무국").map(col).join('')
    + '</div></div>';
}

/* ─────────── 이벤트 ─────────── */
document.addEventListener("change", e=>{
  const dc = e.target.closest("[data-doc]");
  if(dc){ const d = DOCS().filter(x=>x.id===dc.dataset.doc)[0]; if(d){ d.checked = dc.checked; save(); } return; }
  const cb = e.target.closest("[data-chk]"); if(!cb) return;
  const x = byId(cb.dataset.chk), i = +cb.dataset.i; if(!x) return;
  x.done = x.done||[];
  if(cb.checked){ if(x.done.indexOf(i)<0) x.done.push(i); }
  else x.done = x.done.filter(v=>v!==i);
  save();
});

document.addEventListener("click", e=>{
  const v = e.target.closest("[data-v]");
  if(v){ view=v.dataset.v;
    document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
    sideNav.classList.remove("open"); window.scrollTo({top:0}); renderFavs(); render(); return; }
  const f = e.target.closest("[data-f]");
  if(f){ filter=f.dataset.f; document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b===f)); render(); return; }
  const s = e.target.closest("[data-sort]");
  if(s){ const k=s.dataset.sort; sortDir = (sortKey===k) ? -sortDir : 1; sortKey=k; render(); return; }
  const pn = e.target.closest("[data-person]");
  if(pn){ openPerson(pn.dataset.person); return; }
  const wf = e.target.closest("[data-wf]");
  if(wf){ const v = wf.dataset.wf;
    if(v === "*") calWho = null;
    else if(v === "@me") calWho = new Set([ME]);
    else {
      const tally = ownerTally(agenda()).map(x=>x[0]);
      if(!calWho) calWho = new Set(tally);          // 전체 상태에서 하나 끄면 나머지 유지
      if(calWho.has(v)) calWho.delete(v); else calWho.add(v);
      if(!calWho.size || calWho.size === tally.length) calWho = null;
    }
    render(); return; }
  const dp = e.target.closest("[data-docpick]");
  if(dp){
    if(!docPick) docPick = new Set(DB.tasks.map(t=>t.id));
    if(dp.checked) docPick.add(dp.dataset.docpick); else docPick.delete(dp.dataset.docpick);
    const box = dp.closest(".item"); if(box) box.classList.toggle("unpicked", !dp.checked);
    return;
  }
  if(e.target.closest("[data-docall]")){ docPick = null; render(); return; }
  if(e.target.closest("[data-docnone]")){ docPick = new Set(); render(); return; }
  const gs = e.target.closest("[data-gsel]");
  if(gs){ const grp = gs.closest(".grp");
    docPick = new Set([...grp.querySelectorAll("[data-item]")].map(el=>el.dataset.item));
    render(); return; }
  if(e.target.closest("[data-docedit]")){
    docEdit = !docEdit;
    document.body.classList.toggle("docedit", docEdit);
    render(); return;
  }
  const dw = e.target.closest("[data-docwho]");
  if(dw){ docWho = dw.dataset.docwho; render(); return; }
  if(e.target.closest("[data-docprint]")){ print(); return; }
  if(e.target.closest("[data-docword]")){ saveDocAsWord(); return; }
  const cb = e.target.closest("[data-cat]");
  if(cb){ catFilter = cb.dataset.cat; subFilter = "all"; render(); return; }
  const sb = e.target.closest("[data-sub]");
  if(sb){ subFilter = sb.dataset.sub; render(); return; }
  const fp = e.target.closest("[data-folder]");
  if(fp){ copyPath(fp.dataset.folder); return; }
  const v2 = e.target.closest("[data-v2]");
  if(v2){ const t2 = v2.dataset.v2;
    document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on", b.dataset.v===t2));
    view = t2; window.scrollTo({top:0}); renderFavs(); render(); return; }
  const wq = e.target.closest("[data-who]");
  if(wq){ setWho(wq.dataset.who); return; }
  const ck = e.target.closest("[data-cert]");
  if(ck){ const [eid, who] = ck.dataset.cert.split("|"); const ev2 = byEid(eid);
    if(ev2){ ev2.completed = ev2.completed || [];
      const i = ev2.completed.indexOf(who);
      if(i >= 0) ev2.completed.splice(i,1); else ev2.completed.push(who);
      save(); }
    return; }
  const cf = e.target.closest("[data-ctfav]");
  if(cf){ const c = byCid(cf.dataset.ctfav); if(c){ c.fav = !c.fav; save(); } return; }
  const ce = e.target.closest("[data-ctedit]");
  if(ce){ openContact(byCid(ce.dataset.ctedit)); return; }
  const cc = e.target.closest("[data-ct]");
  if(cc){ ctCat = cc.dataset.ct; render(); return; }
  const ne = e.target.closest("[data-newev]");
  if(ne && !e.target.closest(".ev")){ openEventForm(null, ne.dataset.newev); return; }
  const ee = e.target.closest("[data-evedit]");
  if(ee){ if(edlg.open) edlg.close(); openEventForm(byEid(ee.dataset.evedit)); return; }
  if(e.target.id==="goev"){ view="events"; document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v==="events")); render(); return; }
  if(e.target.id==="goadd"){ openEventForm(null, iso(new Date())); return; }
  const ow = e.target.closest("[data-owner]");
  if(ow){ if(edlg.open) edlg.close(); if(pdlg.open) pdlg.close(); openOwner(ow.dataset.owner); return; }
  const tt = e.target.closest("[data-toTask]");
  if(tt){ const id = tt.dataset.totask || tt.getAttribute("data-toTask"); if(edlg.open) edlg.close(); eventToTask(id); return; }
  const zm = e.target.closest("[data-zoom]");
  if(zm){ const [tid,i] = zm.dataset.zoom.split("|"); const sh = (byId(tid).shots||[])[+i];
    if(sh){ zimg.src = sh.src; zcap.textContent = sh.t || ""; zdlg.showModal(); } return; }
  const ds = e.target.closest("[data-delshot]");
  if(ds){ const x = byId(ds.dataset.delshot); if(confirm("이 캡처 삭제?")){ x.shots.splice(+ds.dataset.i,1); save(); } return; }
  const pk = e.target.closest("[data-pick]");
  if(pk){ const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.multiple=true;
    inp.onchange = ()=>addShots(pk.dataset.pick, [...inp.files]); inp.click(); return; }
  const cm = e.target.closest("[data-cal]");
  if(cm){ const v=+cm.dataset.cal;
    if(v===0){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth()+1; }
    else { calM+=v; if(calM<1){calM=12;calY--;} if(calM>12){calM=1;calY++;} }
    render(); return; }
  const ec = e.target.closest("[data-ev]");
  if(ec){ evCat=ec.dataset.ev; render(); return; }
  const evv = e.target.closest("[data-event]");
  if(evv){ openEvent(evv.dataset.event); return; }
  const tk = e.target.closest("[data-task]");
  if(tk){ if(pdlg.open) pdlg.close(); openTask(tk.dataset.task); return; }
  const ed = e.target.closest("[data-edit]");
  if(ed){ if(pdlg.open) pdlg.close(); if(tdlg.open) tdlg.close(); open(byId(ed.dataset.edit)); return; }
  const al = e.target.closest("[data-addlog]");
  if(al){ addLog(al.dataset.addlog); return; }
  const dl = e.target.closest("[data-dellog]");
  if(dl){ const x = byId(dl.dataset.dellog); x.log.splice(+dl.dataset.i,1); save(); }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.log){ e.preventDefault(); addLog(e.target.dataset.log); }
});

function addLog(id){
  const inp = document.querySelector('[data-log="'+id+'"]');
  const v = inp.value.trim(); if(!v) return;
  const x = byId(id); x.log = x.log||[];
  x.log.push({d:today(), t:v});
  save();
}

// 인계서에서 바로 고친 내용 저장
document.addEventListener("focusout", e=>{
  const el = e.target.closest && e.target.closest("[data-edit-field]");
  if(!el) return;
  const t = byId(el.dataset.editId); if(!t) return;
  const f = el.dataset.editField;
  const raw = el.innerText.replace(/\u00a0/g, " ");
  const before = JSON.stringify(t[f]);
  if(el.dataset.list === "1") t[f] = raw.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
  else t[f] = raw.trim();
  if(JSON.stringify(t[f]) === before) return;
  t.log = t.log || [];
  t.log.push({d: today(), t: "인계서에서 수정 · " + f});
  save();
});

document.addEventListener("paste", e=>{
  if(!tdlg.open || !curTask) return;
  const imgs = [...(e.clipboardData?.items||[])].filter(i=>i.type.indexOf("image")===0)
                 .map(i=>i.getAsFile()).filter(Boolean);
  if(imgs.length){ e.preventDefault(); addShots(curTask.id, imgs); }
});

// ── 즐겨찾기: 자주 쓰는 메뉴를 사이드바 맨 위로 ──────────
const FAVKEY = "eopmu_fav_v1";
let favs = [];
try{ favs = JSON.parse(localStorage.getItem(FAVKEY)) || []; }catch(e){ favs = []; }

// 원본 메뉴 버튼을 .navrow 로 감싸고 별표를 붙인다
function wrapNavButtons(){
  sideNav.querySelectorAll('.navgrp:not(#favGrp) > button').forEach(btn=>{
    const key = btn.dataset.v || btn.id;
    if(!key) return;
    const row = document.createElement('div');
    row.className = 'navrow';
    btn.parentNode.insertBefore(row, btn);
    row.appendChild(btn);
    const st = document.createElement('button');
    st.className = 'star';
    st.dataset.fav = key;
    st.title = '즐겨찾기';
    st.textContent = '★';
    row.appendChild(st);
  });
}

function renderFavs(){
  favList.innerHTML = '';
  const rows = favs.map(k=>{
    const src = sideNav.querySelector('.navgrp:not(#favGrp) [data-v="'+k+'"], .navgrp:not(#favGrp) #'+k);
    if(!src) return null;
    const b = document.createElement('button');
    if(src.dataset.v) b.dataset.v = src.dataset.v; else b.dataset.run = src.id;
    b.textContent = src.textContent;
    b.className = src.classList.contains('on') ? 'on' : '';
    return b;
  }).filter(Boolean);
  rows.forEach(b=>favList.appendChild(b));
  favGrp.hidden = !rows.length;
  sideNav.querySelectorAll('[data-fav]').forEach(st=>{
    st.classList.toggle('on', favs.indexOf(st.dataset.fav) >= 0);
  });
}

sideNav.addEventListener('click', e=>{
  const st = e.target.closest('[data-fav]');
  if(st){
    e.stopPropagation();
    const k = st.dataset.fav, i = favs.indexOf(k);
    if(i >= 0) favs.splice(i,1); else favs.push(k);
    try{ localStorage.setItem(FAVKEY, JSON.stringify(favs)); }catch(e){}
    renderFavs();
    return;
  }
  // 즐겨찾기의 «작업» 버튼은 원본 버튼을 대신 눌러 준다
  const run = e.target.closest('[data-run]');
  if(run){ const src = document.getElementById(run.dataset.run); if(src) src.click(); }
});

wrapNavButtons();
renderFavs();

// ── 사이드바 접기 (Ctrl+\\ 로도 토글) ───────────────────
const FOLDKEY = "eopmu_navfold_v1";
function setFold(on){
  document.body.classList.toggle('folded', on);
  try{ localStorage.setItem(FOLDKEY, on ? '1' : '0'); }catch(e){}
}
try{ if(localStorage.getItem(FOLDKEY) === '1') document.body.classList.add('folded'); }catch(e){}
navFold.onclick = ()=> setFold(true);
navUnfold.onclick = ()=> setFold(false);
document.addEventListener('keydown', e=>{
  if(e.key === '\\' && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    setFold(!document.body.classList.contains('folded'));
  }
});

navToggle.onclick = ()=> sideNav.classList.toggle('open');
q.oninput = ()=>{ query = q.value.trim(); render(); };
add.onclick = ()=>open(null);
prt.onclick = ()=>print();

function open(x){
  editing = x || null;
  del.style.display = x ? "" : "none";
  const f = form, v = (k,d)=> (x&&x[k]!=null) ? x[k] : d;
  f.name.value=v("name",""); f.desc.value=v("desc","");
  const cur = v("cat","");
  catSel.innerHTML = Object.keys(CATGROUP).map(g=>
      '<optgroup label="'+esc(g)+'">'
      + CATGROUP[g].map(c=>'<option>'+esc(c)+'</option>').join('')
      + '</optgroup>').join('')
    + (ALLCATS().filter(c=>catGroupOf(c)==="기타").length
        ? '<optgroup label="기타">'
          + ALLCATS().filter(c=>catGroupOf(c)==="기타").map(c=>'<option>'+esc(c)+'</option>').join('')
          + '</optgroup>' : '');
  catSel.value = cur || "행정";
  const fillSub = ()=>{
    const list = subsOf(catSel.value);
    subSel.innerHTML = '<option value="">— 없음 —</option>'
      + list.map(x=>'<option>'+esc(x)+'</option>').join('');
    subSel.value = v("sub","");
    subSel.disabled = !list.length;
  };
  const fillFolder = ()=>{
    const root = FOLDER_ROOT()[catSel.value] || "";
    const fl = FOLDERLIST()[catSel.value] || [];
    folderSel.innerHTML = '<option value="">— 없음 —</option>'
      + fl.map(fn=>'<option value="'+esc(root+"\\"+fn)+'">'+esc(fn)+'</option>').join('');
    folderSel.value = v("folder","");
    folderSel.disabled = !fl.length;
  };
  fillSub(); fillFolder();
  catSel.onchange = ()=>{ fillSub(); fillFolder(); };
  f.cycle.value=v("cycle",""); f.prio.value=v("prio",""); f.type.value=v("type","keep"); f.counterpart.value=v("counterpart","");
  f.deadline.value=v("deadline",""); f.systems.value=(v("systems",[])).join(", ");
  f.status.value=v("status", DEFSTAT[v("type","keep")]||"미착수");
  f.next.value=(v("next",[])).join(String.fromCharCode(10));
  f.steps.value=(v("steps",[])).join("\n");
  f.files.value=(v("files",[])).join("\n");
  f.assets.value=(v("assets",[])).join("\n");
  f.traps.value=(v("traps",[])).join("\n");
  dlg.showModal();
}

dlg.addEventListener("close", ()=>{
  const val = dlg.returnValue, f = form;
  if(val==="del"){ if(editing && confirm("삭제?")){ DB.tasks = DB.tasks.filter(t=>t!==editing); save(); } return; }
  if(val!=="ok") return;
  const data = {name:f.name.value.trim(), desc:f.desc.value.trim(), cat:f.cat.value.trim(),
    sub:f.sub.value, folder:f.folder.value, prio:f.prio.value.trim(),
    cycle:f.cycle.value.trim(), type:f.type.value, counterpart:f.counterpart.value.trim(),
    deadline:f.deadline.value.trim(), systems:C(f.systems.value),
    status:f.status.value, next:L(f.next.value),
    steps:L(f.steps.value), files:L(f.files.value), assets:L(f.assets.value), traps:L(f.traps.value)};
  if(editing) Object.assign(editing, data);
  else DB.tasks.push(Object.assign({id:"t"+Date.now(), done:[], log:[], next:[], files:[], shots:[]}, data));
  save();
});

exp.onclick = ()=>{
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}));
  a.download = "tasks.json"; a.click();
};
tsv.onclick = ()=>{
  const head = COLS.map(c=>c[1]).join("\t");
  const body = visible().map(x=>[TN[x.type],x.cat,x.name,x.cycle,x.deadline,x.counterpart,
    (x.systems||[]).join(", "),(x.files||[]).join(", "),(x.shots||[]).length,(x.steps||[]).length,(x.log||[]).length].join("\t")).join("\n");
  const txt = head+"\n"+body;
  const done = ()=>{ tsv.textContent="복사됨 ✓"; setTimeout(()=>tsv.textContent="표 복사(엑셀)",1500); };
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); done();
  }
};
imp.onclick = ()=>{
  const i = document.createElement("input"); i.type="file"; i.accept=".json";
  i.onchange = ()=>{ i.files[0].text().then(t=>{ DB = JSON.parse(t); save(); }); };
  i.click();
};

syncInit();
render();
</script>
